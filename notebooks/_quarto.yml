project:
  type: default
  output-dir: ../docs/slides
  render:
    - formation/*.ipynb
    - trading/*.ipynb
    - thesis/*.ipynb
    - main_results.ipynb
    - comparison.ipynb
    - performance_guide.ipynb

lang: zh-TW

format:
  revealjs:
    theme: [default, slides.scss]
    width: 1400
    height: 900
    margin: 0.06
    center: false
    slide-number: c/t
    hash: true
    transition: fade
    slide-level: 2
    scrollable: true
    html-math-method: katex
    code-line-numbers: false
    highlight-style: dracula
    preview-links: true
    link-external-newwindow: true
    embed-resources: true

execute:
  enabled: false
  echo: false
  warning: false
